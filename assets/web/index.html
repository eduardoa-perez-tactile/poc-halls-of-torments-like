<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11191c">
  <title>Couch Crypt · Your controller</title>
  <link rel="stylesheet" href="/controller.css">
  <script src="/controller.js" defer></script>
</head>
<body>
  <main>
    <header><span class="sigil" aria-hidden="true">◇</span><p class="eyebrow">COUCH CRYPT</p><p class="subtitle">Two souls. One descent.</p></header>
    <section class="card" aria-labelledby="title">
      <p class="eyebrow" id="player">THE GATHERING</p>
      <h1 id="title">Join your party</h1>
      <p id="message" role="status" aria-live="polite">Keep your phone on the same Wi-Fi as the TV.</p>
      <form id="join-form">
        <label for="room">Room code on the TV</label>
        <input id="room" name="room" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABC123" required pattern="[A-Za-z0-9]{6}">
        <button id="join" type="submit">Join party</button>
      </form>
      <div id="connected" hidden><div class="connection-mark" aria-hidden="true">✓</div><p id="party">Waiting for your companion</p><p class="hint">The TV remote controls the lobby.<br>Your phone controls your character when the adventure begins.</p></div>
    </section>
    <footer><span id="network-status">LOCAL NETWORK</span><br>Keep this page open while you play.</footer>
  </main>
</body>
</html>
